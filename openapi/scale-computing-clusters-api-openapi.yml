                  numVCPU:
                    type: number
                    format: double
                  mem:
                    type: number
                    format: double
                  driveCapacity:
                    type: number
                    format: double
                  driveAllocation:
                    type: number
                    format: double
                  description:
                    type: string
                  state:
                    type: number
                    format: double
                  name:
                    type: string
                  uuid:
