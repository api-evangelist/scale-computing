                critical:
                  type: number
                  format: double
              required:
              - info
              - notice
              - warning
              - critical
              type: object
            conditions:
              items: {}
              type: array
            vms:
              items:
                properties:
                  tags:
                    items:
                      type: string
                    type: array
                  stats:
                    properties:
                      cpuUsage:
                        type: number
