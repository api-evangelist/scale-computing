openapi: 3.2.0
info:
  title: Scale Computing Clusters API
  contact: {}
  version: '1.0'
  description: 'Operations tagged Clusters across 2 of this provider''s published API definitions: scale-computing-core-openapi.json, scale-computing-fleet-manager-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /
- url: https://api.scalecomputing.com
  description: Fleet Manager API
tags:
- name: Clusters
paths:
  /api/v1/clusters/{clusterId}:
    get:
      operationId: GetCluster
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - jwt:
        - cluster:read:*
      parameters:
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      tags:
      - Clusters
    delete:
      operationId: DeleteCluster
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - jwt:
        - cluster:delete:*
      parameters:
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      tags:
      - Clusters
    put:
      operationId: UpdateCluster
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - jwt:
        - cluster:update:*
      parameters:
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      tags:
      - Clusters
    servers:
    - url: /
  /api/v1/clusters:
    get:
      operationId: GetClusters
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Cluster'
                type: array
      security:
      - jwt:
        - cluster:read:*
      parameters:
      - in: query
        name: filters
        required: true
        schema:
          type: string
      - in: query
        name: projections
        required: false
        schema:
          type: string
      tags:
      - Clusters
    servers:
    - url: /
  /api/v1/clusters/{clusterId}/stream/start:
    post:
      operationId: StartClusterStream
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Boolean'
      security:
      - jwt:
        - cluster:read:*
      parameters:
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                autoStopSeconds:
                  type: number
                  format: double
                intervalMS:
                  type: number
                  format: double
              type: object
      tags:
      - Clusters
    servers:
    - url: /
  /api/v1/clusters/{clusterId}/command:
    post:
      operationId: ClusterCommandSend
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: boolean
      description: Create a command request.
      security:
      - jwt:
        - cluster:update:*
      parameters:
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                payload:
                  additionalProperties: true
                  type: object
                command:
                  type: string
              required:
              - payload
              - command
              type: object
      tags:
      - Clusters
    servers:
    - url: /
  /api/v1/clusters/{clusterId}/tunnel:
    post:
      operationId: StartTunnel
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - jwt:
        - secureLink:read:*
      parameters:
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                force:
                  type: boolean
                useUuid:
                  type: boolean
                additionalRouteArgs:
                  $ref: '#/components/schemas/AdditionalRouteArgs'
              required:
              - additionalRouteArgs
              type: object
      tags:
      - Clusters
    get:
      operationId: ViewTunnel
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - jwt:
        - secureLink:read:*
      parameters:
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      tags:
      - Clusters
    servers:
    - url: /
  /api/v1/clusters/migrate:
    post:
      operationId: Migrate
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
      security:
      - jwt:
        - clusterMigration:create:*
      parameters: []
      tags:
      - Clusters
    servers:
    - url: /
  /api/v2/clusters:
    get:
      operationId: ClustersController_findAll
      parameters:
      - name: query
        required: false
        in: query
        schema:
          type: string
          default: ''
      - name: offset
        required: false
        in: query
        schema:
          default: 0
          type: number
          minimum: 0
      - name: limit
        required: false
        in: query
        description: limit is defaulted to 20 if not passed. The value can range between 1-200.
        schema:
          default: 20
          type: number
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ClusterDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
      security:
      - API Key: []
      summary: Get a list of clusters
      tags:
      - Clusters
    servers:
    - url: https://api.scalecomputing.com
      description: Fleet Manager API
  /api/v2/clusters/download:
    get:
      operationId: ClustersController_downloadCsv
      parameters: []
      responses:
        '200':
          description: Sample response of downloading csv data of clusters
          content:
            text/csv:
              schema:
                type: string
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
      security:
      - API Key: []
      summary: Get a .csv of clusters
      tags:
      - Clusters
    servers:
    - url: https://api.scalecomputing.com
      description: Fleet Manager API
  /api/v2/clusters/{id}:
    get:
      operationId: ClustersController_findOne
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
      security:
      - API Key: []
      summary: Get a specific cluster by Id
      tags:
      - Clusters
    servers:
    - url: https://api.scalecomputing.com
      description: Fleet Manager API
  /api/v2/clusters/{id}/tags:
    post:
      operationId: ClustersController_upsertClusterTags
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/'
            examples:
              sample1:
                description: sample request body payload for tags
                value:
                  tags: foo, bar, baz
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PageDto'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ClusterDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestException'
      security:
      - API Key: []
      summary: Overwrite the existing cluster tags with the provided comma-separated list of tags
      tags:
      - Clusters
    servers:
    - url: https://api.scalecomputing.com
      description: Fleet Manager API
