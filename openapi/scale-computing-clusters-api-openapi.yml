          exclude: true
        nodeCount:
          type:
          - number
          - 'null'
          example: '3'
        version:
          type:
          - string
          - 'null'
          example: 1.2.3
        storagePercent:
          type:
          - number
          - 'null'
          example: '52'
        memoryPercent:
          type:
          - number
          - 'null'
