openapi: 3.2.0
info:
  title: SC//Fleet Manager Health API
  description: 'The OpenAPI Specification JSON Schema can be imported into the API tool of your choice, such as Postman or Insomnia.


    This REST API allows programmatic role-based access to your SC//Fleet Manager data. Use the "Authorize" button to input API Keys created in Fleet Manager and try out the API directly from your browser. Note: Each endpoint is role restricted in alignment with the UI access levels, which are detailed in the Fleet Manager User Guide.'
  version: '2.0'
  contact: {}
