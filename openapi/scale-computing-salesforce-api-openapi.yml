openapi: 3.2.0
info:
  title: core Salesforce API
  version: 1.0.0
  license:
    name: ISC
  contact: {}
servers:
- url: /
tags:
- name: Salesforce
paths:
  /api/v1/salesforce/account/{id}:
    get:
      operationId: GetSalesForceAccount
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesforceAccount'
      security:
      - jwt:
        - salesforceAccount:read:*
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      tags:
      - Salesforce
    post:
      operationId: SyncSalesforceAssets
      responses:
        '204':
          description: No content
      security:
      - jwt:
        - asset:update:*
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      tags:
      - Salesforce
components:
  schemas:
    SalesforceAccount:
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      type: object
      additionalProperties: true
  securitySchemes:
    tsoa_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: http://swagger.io/api/oauth/dialog
          scopes: {}
