openapi: 3.2.0
info:
  title: core Organization Salesforce Account API
  version: 1.0.0
  license:
    name: ISC
  contact: {}
servers:
- url: /
tags:
- name: Organization Salesforce Account
paths:
  /api/v1/organization-salesforce-account:
    put:
      operationId: UpdateOrganizationSalesforceAccount
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
      security:
      - jwt:
        - organizationSalesforceAccount:create:*
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                id:
                  type: string
              required:
              - name
              - id
              type: object
      tags:
      - Organization Salesforce Account
components:
  schemas:
    VersionCounts:
      properties: {}
      additionalProperties:
        $ref: '#/components/schemas/Version'
      type: object
    Organization:
      properties:
        _id:
          type: string
        name:
          type: string
        clusterSecretKey:
          type: string
        settings:
          $ref: '#/components/schemas/OrganizationSettings'
        stats:
          $ref: '#/components/schemas/OrgnizationStats'
        salesforce:
          properties:
            syncError:
              type:
              - string
              - 'null'
            syncStatus:
              type: string
              enum:
              - syncing
              - idle
              - error
            name:
              type: string
            id:
              type: string
          required:
          - syncError
          - syncStatus
          - name
          - id
          type: object
        deletedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
      - _id
      - name
      - clusterSecretKey
      - settings
      - stats
      - salesforce
      - deletedAt
      - createdAt
      type: object
      additionalProperties: true
    Version:
      properties:
        count:
          type: number
          format: double
        label:
          type: string
      required:
      - count
      - label
      type: object
    OrgnizationStats:
      properties:
        online:
          type: number
          format: double
        offline:
          type: number
          format: double
        total:
          type: number
          format: double
        health:
          additionalProperties: true
          type: object
        conditions:
          additionalProperties: true
          type: object
        versions:
          $ref: '#/components/schemas/VersionCounts'
      required:
      - online
      - offline
      - total
      - health
      - conditions
      - versions
      type: object
      additionalProperties: true
    OrganizationSettings:
      properties:
        simulationEnabled:
          type: boolean
        secureLinkDisabled:
          type: boolean
        simulations:
          properties:
            totalClustersPerBatch:
              type: number
              format: double
            totalBatches:
              type: number
              format: double
          required:
          - totalClustersPerBatch
          - totalBatches
          type: object
        monitoring:
          properties:
            enabled:
              type: boolean
              enum:
              - false
          required:
          - enabled
          type: object
      required:
      - simulationEnabled
      - secureLinkDisabled
      - simulations
      - monitoring
      type: object
      additionalProperties: true
  securitySchemes:
    tsoa_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: http://swagger.io/api/oauth/dialog
          scopes: {}
