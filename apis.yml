- name: Scale Computing Platform Core API
  description: >-
    Undocumented v1 control-plane REST API served alongside SC//Fleet Manager on api.scalecomputing.com, whose
    OpenAPI 3.0 description is published anonymously at /swagger.json. Covers cluster registration and command
    dispatch, node registration and certificate issuance, staged (zero-touch) cluster provisioning, organization
    and organization-role management, user invitation/authentication/access-token issuance, EULA acceptance and
    Salesforce account synchronization. Scale Computing publishes no human-facing reference for this surface;
    the spec itself is the only published artifact, and it carries no operation summaries, tags or descriptions.
  humanURL: https://api.scalecomputing.com/swagger.json
  baseURL: https://api.scalecomputing.com
  tags:
  - Infrastructure Management
  - Edge Computing
  - Identity
  tags_raw:
  - infrastructure-management
  - edge-computing
  - identity
  properties:
  - type: OpenAPI
    url: openapi/scale-computing-core-openapi.json
  - type: Overlay
    url: overlays/scale-computing-core-overlay.yaml
- name: SC//HyperCore REST API
  description: >-
    On-appliance REST API exposed by every SC//HyperCore (HC3) clustered node for automating virtual machines,
    virtual disks, networks, snapshots, snapshot schedules, replication, node and cluster operations, users and
    roles. It is served from the customer's own cluster rather than from a Scale Computing host, so its base URL
    is templated on the clustered node address and its Swagger documentation is reachable only from inside the
    customer network at /rest/v1/docs/ or through the Control Panel Support tab. Scale Computing publishes
    example scripts against it on GitHub and wraps it in a first-party Ansible collection and Terraform provider.
  humanURL: https://github.com/ScaleComputing/RestAPIExamples
  baseURL: https://{clustered_node_ip}/rest/v1
  tags:
  - Virtualization
  - Hyperconverged Infrastructure
  - Virtual Machines
  - Infrastructure as Code
  tags_raw:
