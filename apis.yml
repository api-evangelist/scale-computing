apis:
- name: SC//HyperCore REST API
  description: >-
    On-appliance REST API exposed by every SC//HyperCore (HC3) clustered node for automating virtual machines,
    virtual disks, networks, snapshots, snapshot schedules, replication, node and cluster operations,
    users and roles. It is served from the customer's own cluster rather than from a Scale Computing host,
    so its base URL is templated on the clustered node address and its Swagger documentation is reachable
    only from inside the customer network at /rest/v1/docs/ or through the Control Panel Support tab.
    Scale Computing publishes example scripts against it on GitHub and wraps it in a first-party Ansible
    collection and Terraform provider.
  humanURL: https://github.com/ScaleComputing/RestAPIExamples
  baseURL: https://{clustered_node_ip}/rest/v1
  tags:
  - Virtualization
  - Hyperconverged Infrastructure
  - Virtual Machines
  - Infrastructure as Code
  tags_raw:
