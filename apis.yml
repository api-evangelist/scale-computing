apis:
- name: SC//Fleet Manager API
  description: >-
    Public cloud REST API for SC//Fleet Manager. Read-mostly, role-restricted access to an organization's fleet:
    list and retrieve HyperCore clusters, virtual machines, cluster conditions (issues reported by clusters),
    organization activity audit entries and historical CPU/RAM/storage time-series metrics; CSV export endpoints
    for clusters and VMs; write access limited to overwriting cluster tags and creating/deleting API keys.
    Authenticated with an `api-key` request header issued from the Fleet Manager organization settings screen.
  humanURL: https://api.scalecomputing.com/api/v2
  baseURL: https://api.scalecomputing.com
