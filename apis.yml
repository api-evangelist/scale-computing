aid: scale-computing
name: Scale Computing
description: >-
  Scale Computing builds SC//Platform, an edge-computing and hyperconverged infrastructure stack made up of
  SC//HyperCore (a self-healing KVM-based virtualization and storage OS that runs on clustered appliance nodes)
  and SC//Fleet Manager (a cloud console that monitors, updates and orchestrates thousands of distributed
  HyperCore clusters, VMs and containerized edge applications from one place). The programmable surface is split
  the same way: SC//HyperCore exposes an on-appliance REST API at /rest/v1 on each clustered node for VM, disk,
  network, snapshot and replication automation, while SC//Fleet Manager exposes a public, API-key-authenticated
  cloud REST API at api.scalecomputing.com for fleet-wide clusters, virtual machines, conditions, metrics,
  organization activity and API-key management. Scale Computing also ships and maintains a first-party Ansible
  collection and Terraform provider for HyperCore, publishes REST API example scripts on GitHub, and defines a
  JSON Schema for Fleet Manager application manifests used by its edge application lifecycle management feature.
